# Draws your contribution graph as an animated snake, in the portfolio's
# cyan palette, and publishes the SVGs to the `output` branch the README reads.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#5ce1e6&color_dots=#161b22,#0e4a4d,#1a7276,#2f9ba0,#5ce1e6
            dist/snake-light.svg?color_snake=#2f9ba0&color_dots=#ebedf0,#b3eef0,#7fdde1,#3fb9be,#2f9ba0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
